[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-fa-suite"
version = "0.1.0"
description = "ATE Test Log Visualizer & Diagnostics Suite — datalog → waveform reconstruction and fail-signature clustering for failure analysis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "aiman-hakim-zahari" }]
keywords = ["ate", "semiconductor", "failure-analysis", "datalog", "waveform", "lark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

# Tkinter comes from Python, so Lark is the only runtime package.
dependencies = ["lark>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mypy>=1.5"]

[project.scripts]
ate-fa-suite = "ate_fa_suite.__main__:main"

[project.urls]
Homepage = "https://github.com/aiman-hakim-zahari/ate-test-log-tool"

[tool.setuptools.packages.find]
include = ["ate_fa_suite*"]

# Include the grammar in wheels and zipapps.
[tool.setuptools.package-data]
"ate_fa_suite.parsing.grammar" = ["*.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Performance checks are opt-in because hardware changes the measured rate.
addopts = "-q --strict-markers -m 'not perf'"
# Tests are functions; domain classes may also start with "Test".
python_classes = ["*TestCase"]
markers = [
    "phase1: parser core / chunked path (Step 1-2)",
    "phase2: domain logic (Step 3)",
    "phase3: gui shell (Step 4)",
    "phase4: waveform canvas (Step 5-6)",
    "phase5: STDF V4-2007 ingestion (Step 7-8)",
    "perf: performance baselines, not run by default",
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["ate_fa_suite"]
# Strict typing keeps floating-point view values out of integer model times.
warn_unreachable = true
# Lark provides type information, so missing imports remain errors.
disallow_any_unimported = true
