name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Run source checks on the Windows deployment target.
  test:
    name: pytest + mypy (py${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Test both the minimum and local development Python versions.
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -v

      - name: mypy --strict
        run: mypy --strict ate_fa_suite

      - name: Import firewall (explicit, so a breach is obvious in the log)
        run: pytest tests/test_import_firewall.py -v

  # Build artifacts and verify that they work without network access.
  release-proofs:
    name: offline wheelhouse + zipapp
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: python -m pip install --upgrade pip wheel

      - name: Build wheelhouse and zipapp
        run: python tools/build_release.py

      - name: Wheelhouse must contain the app AND Lark
        shell: pwsh
        run: |
          $wheels = Get-ChildItem dist/wheelhouse -Filter *.whl | ForEach-Object Name
          Write-Host "wheelhouse: $($wheels -join ', ')"
          if (-not ($wheels -match '^ate_fa_suite')) { throw "app wheel missing" }
          if (-not ($wheels -match '^lark'))         { throw "lark wheel missing" }

      # --no-index proves the wheelhouse contains every dependency.
      - name: Offline install into a throwaway venv (--no-index)
        shell: pwsh
        run: |
          python -m venv .venv-offline
          .\.venv-offline\Scripts\python.exe -m pip install --no-index --find-links dist/wheelhouse ate-fa-suite
          .\.venv-offline\Scripts\python.exe -m pip list

      - name: Offline smoke - grammar via importlib.resources + Tk root
        shell: pwsh
        run: .\.venv-offline\Scripts\python.exe tools/smoke_offline.py

      # Run the zipapp from an empty environment.
      - name: Zipapp proof from a bare venv (nothing pip-installed)
        shell: pwsh
        run: |
          python -m venv .venv-bare
          .\.venv-bare\Scripts\python.exe tools/check_zipapp.py dist/ate_fa_suite.pyz

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/wheelhouse/*.whl
            dist/ate_fa_suite.pyz
